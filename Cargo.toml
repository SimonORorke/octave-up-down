[workspace]
members = [
    "app_info",
]
resolver = "2"

[workspace.package]
description = "Octave Up-Down"
license = "MIT or Apache-2.0"
version = "0.1.0"

[package]
name = "octave-up-down"
description.workspace = true
license.workspace = true
version.workspace = true
authors = ["Simon O'Rorke"]
edition = "2024"
build = "build.rs"

[dependencies]
simonor = { path = "../simonor" }
# Once simonor is stable and pushed to remote Git, update the dependency to point
# to its Git repo:
# simonor = { git = "https://github.com/SimonORorke/simonor.git", branch = "main" }
app_info = { path = "app_info" }
env_logger = "0.11.11"
log = "0.4.34"
slint = "1.18.1"

[build-dependencies]
simonor = { path = "../simonor" }
app_info = { path = "app_info" }
# Using embed-resource instead of the more popular winres
# for application icon and exe file properties because
# winres puts an oblique before the apostrophe in my name.
# It's a known shortcoming of winres to always 'escape' an apostrophe.
embed-resource = "3.0.8"
slint-build = "1.18.1"