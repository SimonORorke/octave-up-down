[workspace]
members = [
    "app_info",
]
resolver = "2"

[workspace.package]
description = "Octave Up-Down for MIDI Pedals"
license = "MIT or Apache-2.0"
version = "0.1.0"

[package]
name = "octave-up-down"
description.workspace = true
license.workspace = true
version.workspace = true
authors = ["Simon O'Rorke"]
edition = "2024"
build = "build.rs"

[dependencies]
# simonor is a path dependency to a sibling folder that is itself a separate, nested Cargo
# workspace. `cargo check` and `cargo build` keep separate incremental/fingerprint caches,
# and `cargo check`'s cache can go stale relative to the sibling crate's actual files,
# causing RustRover (which drives its "unresolved import" diagnostics off `cargo check`)
# to show false-positive red underlines for recently added simonor items, even though
# `cargo build` compiles fine. Fix: `cargo clean -p simonor -p simonor-core -p simonor-testing`,
# then close and reopen RustRover so it re-runs `cargo check` from scratch.
simonor = { path = "../simonor" }
# Once simonor is stable, its dependency can be updated to point to its GitHub repo.
# (Point to a tag rather than a branch in due course):
#simonor = { git = "https://github.com/SimonORorke/simonor.git", branch = "main" }
app_info = { path = "app_info" }
env_logger = "0.11.11"
log = "0.4.34"
midly = "0.5.3"
rayon = "1.12.0"
slint = "1.18.1"
# Used for window attributes hook and winit monitor access across platforms.
# Must track the slint version exactly.
i-slint-backend-winit = "1.18.1"
serde = "1.0.229"

[dev-dependencies]
simonor = { path = "../simonor", features = ["testing"] }
googletest = "0.14.3"

[build-dependencies]
simonor = { path = "../simonor" }
#simonor = { git = "https://github.com/SimonORorke/simonor.git", branch = "main" }
app_info = { path = "app_info" }
# Using embed-resource instead of the more popular winres
# for application icon and exe file properties because
# winres puts an oblique before the apostrophe in my name.
# It's a known shortcoming of winres to always 'escape' an apostrophe.
embed-resource = "3.0.12"
slint-build = "1.18.1"